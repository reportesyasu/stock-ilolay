<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Stock Ilolay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior fija con día y pestañas; debajo, una sola columna de trabajo que en escritorio es tabla y en celular son tarjetas. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e8ecee; --line:#d3dadd; --ink:#15232d; --muted:#5a6a73;
  --accent:#1d5f86; --accent-ink:#ffffff; --frio:#1d6f95; --seco:#9a6b1f;
  --ok:#2f7d4f; --ok-bg:#e3f1e8; --bad:#b3362c; --bad-bg:#f8e4e1; --warn:#946200; --warn-bg:#fbefd2; --info-bg:#e2eef5;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#16222a; --sunk:#1c2b34; --line:#2a3b45; --ink:#e3eaee; --muted:#93a4ad;
  --accent:#5fa9d6; --accent-ink:#071219; --frio:#6cb6dd; --seco:#d9a654;
  --ok:#6cc792; --ok-bg:#163a26; --bad:#f08a7f; --bad-bg:#43201c; --warn:#e6b84e; --warn-bg:#3d3113; --info-bg:#173244; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#16222a; --sunk:#1c2b34; --line:#2a3b45; --ink:#e3eaee; --muted:#93a4ad;
  --accent:#5fa9d6; --accent-ink:#071219; --frio:#6cb6dd; --seco:#d9a654;
  --ok:#6cc792; --ok-bg:#163a26; --bad:#f08a7f; --bad-bg:#43201c; --warn:#e6b84e; --warn-bg:#3d3113; --info-bg:#173244; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.num,td.n,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* barra */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--muted)}
.dia{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.open{background:var(--info-bg);color:var(--accent)} .pill.closed{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.frio{background:var(--info-bg);color:var(--frio)} .pill.seco{background:var(--warn-bg);color:var(--seco)}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.tabs button:hover{color:var(--ink)}
main{padding-block:18px 60px}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:600;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ok{color:var(--ok);border-color:var(--ok)}
.btn.xs{min-height:26px;padding:2px 8px;font-size:12px}
.desc-btns{gap:4px;margin-top:4px}
.art-menu{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;display:grid;gap:2px}
.art-menu .am-tit{padding:6px 10px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-menu button{display:grid;gap:1px;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;color:inherit;font:inherit}
.art-menu button:hover,.art-menu button:focus-visible{background:var(--sunk,#f1f3f5)}
.card .t button.tit{display:block;font-weight:600;overflow-wrap:anywhere;text-align:left;padding:0;font-size:inherit}
.card .ya-contado{border-top:1px dashed var(--line);padding-top:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card.sumando .sumar{background:color-mix(in srgb,var(--ok) 8%,transparent);border-radius:8px;padding:6px}
td.val{white-space:nowrap;font-family:var(--f-mono)}
td.acc .acc-btns{display:grid;grid-template-columns:repeat(2,auto);gap:4px;justify-content:start}
td.acc .btn{min-height:28px;padding:2px 8px;font-size:12px}
.tablebox td input.obs{width:130px}
.tablebox td select{max-width:150px}
.tablebox td.desc{min-width:170px;max-width:260px}
.btn.modo{font-weight:600}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=month],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-height:36px}
textarea{width:100%;min-height:90px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--f-mono);font-weight:500;margin-left:4px;opacity:.8}
/* archivos */
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.file{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:3px;min-width:0;background:var(--surface)}
.file.missing{border-style:dashed;background:transparent}
.file.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.file.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.file.bad{border-color:var(--bad);border-style:solid;background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.file .name{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:12px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
/* números resumen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}
/* tabla */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
/* Grillas: barras de desplazamiento siempre visibles dentro de la pantalla (la grilla no pasa del alto de la ventana) */
.tablebox{overflow:auto;max-height:calc(100vh - var(--topH,58px) - 24px);max-height:calc(100dvh - var(--topH,58px) - 24px);scrollbar-gutter:stable;overscroll-behavior:contain}
.sheet .tablebox{max-height:70vh}
.tablebox thead th{position:sticky;top:0;z-index:2;background:var(--sunk)}
.tablebox::-webkit-scrollbar,.sheet .box::-webkit-scrollbar{width:12px;height:12px}
.tablebox::-webkit-scrollbar-track,.sheet .box::-webkit-scrollbar-track{background:var(--sunk);border-radius:6px}
.tablebox::-webkit-scrollbar-thumb,.sheet .box::-webkit-scrollbar-thumb{background:var(--muted);border-radius:6px;border:2px solid var(--sunk);min-height:40px}
.tablebox::-webkit-scrollbar-corner{background:var(--sunk)}
.tablebox,.sheet .box{scrollbar-width:auto;scrollbar-color:var(--muted) var(--sunk)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px;border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;white-space:nowrap}
tr.sec td{background:var(--sunk);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em}
tr.difneg td.dif{color:var(--bad);font-weight:600} tr.difpos td.dif{color:var(--ok);font-weight:600}
tr.rec td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
tr.rec td{background:#fff3c4}
td.desc{min-width:220px}
td .code{font-family:var(--f-mono);font-size:13px}
.cj{width:64px;text-align:right} .un{width:56px;text-align:right}
td select{max-width:170px} td input.obs{width:140px}
.cnt{display:inline-flex;gap:4px;align-items:center}
.cnt span{font-size:11px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-align:left}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.info{background:var(--info-bg);color:var(--accent)} .banner.bad{background:var(--bad-bg);color:var(--bad)} .banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner .grow{flex:1;min-width:200px}
/* depósito */
.scan{display:contents}
.scan .bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,58px));z-index:10;background:var(--bg);padding-block:8px;box-shadow:0 6px 8px -8px rgba(0,0,0,.25)}
.scan .bar{display:flex;gap:8px;min-width:0}
.scan .bar input{flex:1 1 auto;min-width:0;width:auto}
.scan .bar .btn{flex:0 0 auto}
.scan{min-width:0}
html,body{overflow-x:clip}
@supports not (overflow-x:clip){html{overflow-x:hidden}}
.scan input[type=search]{flex:1;min-width:0;font-size:17px;min-height:46px;font-family:var(--f-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn.cam{position:relative;overflow:hidden}
.btn.cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.cards{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.card.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.card.rec{border-color:var(--warn);border-width:2px;box-shadow:inset 5px 0 0 var(--warn);background:#ffe58a}
.card.rec .meta,.card.rec .small.muted,.card.rec .val .muted{color:#5c4600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card.rec{background:#5a4510}:root:not([data-theme="light"]) .card.rec .meta,:root:not([data-theme="light"]) .card.rec .small.muted{color:#f3dc9a}}
:root[data-theme="dark"] .card.rec{background:#5a4510}
.card.focus{outline:2px solid var(--accent);outline-offset:1px}
.card .t{min-width:0}
.card .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.card .in{display:flex;gap:6px;align-items:center;grid-column:1/-1}
.card .in input{width:84px;min-height:44px;font-size:18px;text-align:right;font-family:var(--f-mono)}
.card .in label{font-size:12px;color:var(--muted);display:grid;gap:2px}
.card details.det{border-top:1px dashed var(--line,#d8dce2);padding-top:6px}
.card details.det summary{cursor:pointer;color:var(--accent,#1d5f86);font-weight:500;padding:4px 0}
.card .det-in{flex-wrap:wrap;margin:6px 0}
.card .det-in input{width:76px}
.card .in.sumar{border-top:1px dashed var(--line,#d8dce2);padding-top:6px;flex-wrap:wrap}
.card .in.sumar input{width:76px}
.card .det-in label .small{font-size:11px}
.card .val{font-family:var(--f-mono);font-size:15px;text-align:right}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
/* panel lateral */
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:flex-end}
.sheet .box{width:min(620px,100%);height:100%;overflow-y:auto;background:var(--surface);padding:18px max(16px,env(safe-area-inset-right,0px)) 40px 18px;display:grid;gap:14px;align-content:start;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sheet .box>*{min-width:0}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;table-layout:fixed}
table.mini th,table.mini td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow:hidden;text-overflow:ellipsis}
table.mini th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--sunk);text-align:left}
table.mini .n{text-align:right;white-space:nowrap}
table.mini tr.sub td{padding-left:18px;color:var(--muted);font-size:12px;border-bottom-style:dashed}
table.mini tr.tot td{font-weight:600;background:var(--sunk)}
table.mini tr.org th{font-size:12.5px;color:var(--ink);text-transform:none;letter-spacing:0}
table.mini td.cli{white-space:nowrap}
table.mini td.mono{font-family:var(--f-mono);font-size:11px;word-break:break-all}
table.mini.g2 td{font-size:12px}
table.mini tr.subt td{font-weight:600;background:var(--sunk);font-size:12px}
table.mini tr.hl td{background:#fff3b0 !important;color:#3a3000}
table.mini tr.hl td .muted{color:#6b5c00}
.hlbox{display:inline-block;background:#fff3b0;border:1px solid #e3cf5a;border-radius:3px;vertical-align:middle}
.pill.hlp{background:#fff3b0;color:#5a4a00;margin-left:6px}
details.arch>summary,details.resdia>summary{list-style:none;cursor:pointer}
details.resdia>summary::-webkit-details-marker{display:none}
details.resdia .arch-flecha::before{content:'▸';color:var(--muted);font-size:15px}
details.resdia[open] .arch-flecha::before{content:'▾'}
details.resdia>.resdia-body{margin-top:12px}
details.arch>summary::-webkit-details-marker{display:none}
details.arch .arch-flecha::before{content:'▸';color:var(--muted);font-size:15px}
details.arch[open] .arch-flecha::before{content:'▾'}
details.arch>.arch-body{margin-top:10px}
.progreso{height:8px;border-radius:4px;background:var(--line);overflow:hidden;max-width:420px}
.progreso>div{height:100%;background:var(--accent,#1d5f86);transition:width .2s}
/* teclado numérico chico */
input[data-tecla]{background:var(--surface);color:var(--text,#111);cursor:pointer;caret-color:transparent}
input[data-tecla]:focus{outline:3px solid var(--accent,#1d5f86);outline-offset:1px;background:color-mix(in srgb,var(--surface) 88%,var(--accent,#1d5f86))}
.tecla{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.15);max-width:520px;margin:0 auto}
.tecla[hidden]{display:none}
.tecla button{height:38px;border:0;border-radius:7px;background:var(--surface);color:var(--text,#111);font:600 19px/1 var(--f-ui,system-ui);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tecla button:active{filter:brightness(.88)}
.tecla button.f{font-size:14px;font-weight:600;background:color-mix(in srgb,var(--surface) 80%,var(--line))}
.tecla button.ok{grid-row:span 2;height:auto;background:var(--accent,#1d5f86);color:#fff;font-size:15px}
body.con-tecla{padding-bottom:190px}
/* aviso grande de guardado */
.ok-grande{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.28);animation:okg-in .15s ease-out}
.ok-grande.sale{opacity:0;transition:opacity .18s}
.okg-caja{width:min(92vw,520px);height:50vh;min-height:260px;border-radius:22px;background:var(--ok,#1e7a3c);color:#fff;display:grid;align-content:center;justify-items:center;gap:10px;padding:20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ok-grande.resta .okg-caja{background:#a2551a}
.okg-icono{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:60px;font-weight:700;line-height:1}
.okg-tit{font-size:34px;font-weight:700;letter-spacing:.5px}
.okg-art{font-size:19px;font-weight:600;max-width:100%;overflow-wrap:anywhere}
.okg-det{font-size:20px;line-height:1.35}
.okg-pie{font-size:13px;opacity:.8;margin-top:6px}
@keyframes okg-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.ok-grande{animation:none}}
details.opsec{padding:0}
details.opsec>summary{cursor:pointer;list-style:none;padding:14px 16px;display:grid;gap:2px;position:relative;padding-right:40px}
details.opsec>summary::-webkit-details-marker{display:none}
details.opsec>summary::after{content:'▸';position:absolute;right:16px;top:14px;color:var(--muted);font-size:16px}
details.opsec[open]>summary::after{content:'▾'}
details.opsec>summary .opt-t{font-size:17px;font-weight:600}
details.opsec[open]>summary{border-bottom:1px solid var(--line)}
details.opsec>.opsec-body{padding:14px 16px}
details.movorg{border:1px solid var(--line);border-radius:var(--r);margin-top:6px;background:var(--surface)}
details.movorg>summary{cursor:pointer;padding:8px 10px;font-size:13px;display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
details.movorg>summary .tq{margin-left:auto;font-weight:600;font-family:var(--f-mono)}
details.movorg>summary{list-style:none}
details.movorg>summary::-webkit-details-marker{display:none}
details.movorg>summary::before{content:'▸';margin-right:4px;color:var(--muted)}
details.movorg[open]>summary::before{content:'▾'}
details.movorg table.mini{border:0;border-top:1px solid var(--line);border-radius:0}
table.mini.g2 td.cli{white-space:normal;word-break:break-word}
table.mini tr.ch td .muted{font-size:11.5px;font-weight:400}
table.mini th:nth-child(1),table.mini td:nth-child(1){width:auto}
.sheet .box .tablebox{overflow-x:auto;max-width:100%}

<script>
/* Atrapa cualquier error de arranque y lo muestra en pantalla, para no quedar en "Cargando…" sin explicación */
window.__VERSION = 'sb53';
window.__errs = [];
function __mostrarErrores() {
  var m = document.getElementById('main'); if (!m) return;
  m.innerHTML = '<div style="padding:16px;font-family:monospace;white-space:pre-wrap;color:#b3362c"><b>Errores al iniciar (' + window.__VERSION + ')</b>\n' + window.__errs.join('\n----\n') + '</div>';
}
window.addEventListener('error', function (e) {
  var src = e.filename ? e.filename.split('/').pop().split('?')[0] : '';
  window.__errs.push((e.message || e) + '\nlínea ' + e.lineno + ':' + e.colno + (src ? ' (' + src + ')' : '') + '\n' + (e.error && e.error.stack ? e.error.stack.split('\n').slice(0, 3).join('\n') : ''));
  __mostrarErrores();
});
window.addEventListener('unhandledrejection', function (e) {
  var m = document.getElementById('main'); if (!m || !/Cargando/.test(m.textContent)) return;
  var r = e.reason || {};
  window.__errs.push('(promesa) ' + (r.message || r) + '\n' + (r.stack ? r.stack.split('\n').slice(0, 3).join('\n') : ''));
  __mostrarErrores();
});
</script>

  }

  function buildSap(rows, info, excluir) {
    const ex = new Set((excluir || ['SFED']).map(U));
    const by = {}; const fuera = []; let n = 0;
    const c = info.col;
    for (let i = info.h + 1; i < rows.length; i++) {

    return { by, fuera, n };
  }
  function buildYasu(rows, info, prefijo) {

  /* ---- Movimientos del día ---- */

    if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + p2(m[2]) + '-' + p2(m[1]);

  }

  const cel = (r, i) => (i >= 0 ? r[i] : '');

  function compute({ maestro, sap, yasu, ajustes, conteos, anterior, quesoSap }) {
    const aj = {};

    const codes = Object.keys(maestro || {}).sort((a, b) => (maestro[a].s || '').localeCompare(maestro[b].s || '') || (maestro[a].o ?? 999) - (maestro[b].o ?? 999));

function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  let t = new TextDecoder('utf-8').decode(u8);

  const meta = /charset\s*=\s*["']?([\w-]+)/i.exec(head);
  if ((meta && !/utf-?8/i.test(meta[1])) || (t.match(/\uFFFD/g) || []).length > 2) t = new TextDecoder('windows-1252').decode(u8);

}
async function fileRows(file) {
  const buf = await file.arrayBuffer();

  const isZip = u8[0] === 0x50 && u8[1] === 0x4b, isOle = u8[0] === 0xd0 && u8[1] === 0xcf;
  if (isZip || isOle) {
    const lib = await libroExcel(buf);
    let best = null;
    for (const n of lib.SheetNames) {
      const rows = await lib.aoa(n) || [];
      const info = Core.detect(rows);
      if (info.kind !== 'desconocido') { if (!best || (best.info.kind === 'mov' && info.kind !== 'mov')) best = { rows, info }; }
    }
    if (best) return best;
    const rows = await lib.aoa(lib.SheetNames[0]) || [];
    return { rows, info: Core.detect(rows) };
  }
  const txt = decodeText(buf);
  const fr = /<frame[^>]+src\s*=\s*["']?([^"'>]+?_(?:archivos|files|arquivos))\/sheet\d+\.html?/i.exec(txt);
  if (fr && /<frameset/i.test(txt)) return { rows: [], info: { kind: 'desconocido' }, marco: decodeURIComponent(fr[1]) };

      if (info.kind === 'desconocido' || found[info.kind]) { if (info.kind === 'desconocido') err.push(f.name); continue; }
      const meta = { name: f.name, mod: f.lastModified, path: f.webkitRelativePath || f.name };
      if (info.kind === 'sap') found.sap = { ...meta, data: Core.buildSap(rows, info, opt('excluir')) };
      if (info.kind === 'yasu') {
        const ses = rows.slice(0, info.h).map(r => r.join(' ')).join(' ');
        const fx = /Fecha:\s*([\d/-]+)\s*\|?\s*Hora:\s*([\d:]+)/i.exec(ses);
        found.yasu = { ...meta, data: Core.buildYasu(rows, info, opt('prefijo')), export: fx ? fx[1] + ' ' + fx[2] : '' };
      }
      if (info.kind === 'fya') found.fya = { ...meta, data: Core.buildFya(rows, info, opt('prefijo')) };

function movDiaHtml(c) {
  const M = movsActuales();
  const titulo = '<span class="lbl">Movimientos del día</span>';
  if (!M) return titulo + `<div class="small muted">${S.movsCargando ? 'Buscando los movimientos…' : 'Todavía no se cargaron los archivos de facturación (Yasukawa, Ilolay y comprobantes) ni el de ventanas. Se cargan en Administración, en "Archivos del día".'}</div>`;
  const u = (LINES.find(x => x.c === c)?.uxc) || S.maestro[c]?.u || 1;
  const cj = q => { const sp = Core.split(Math.abs(q), u); return `<span class="muted">${fmt(sp.cj)}cj ${fmt(sp.un)}u</span>`; };
  const corto = n => String(n || '').split(/\s+/).slice(0, 2).join(' ');
  const arch = Object.entries({ fya: 'Fact. Yasukawa', fil: 'Fact. Ilolay', comp: 'Comprobantes', vent: 'Ventanas' }).map(([k, n]) => `${n} ${M.archivos?.[k] ? '✓' : '<span style="color:var(--bad)">falta</span>'}`).join(' · ');
  const fs = M.filas.filter(x => x.c === c);
  if (!fs.length) return titulo + `<div class="small muted">Este artículo no tiene movimientos en los archivos cargados.</div><div class="small muted">${arch}</div>`;
  const cuenta = fs.filter(x => x.ms !== false);
  const total = cuenta.reduce((s, x) => s + x.q, 0);
  // Resaltar en amarillo lo que coincide (± el % de Opciones) con la diferencia entre contado y sistema
  const tol = tolMov();
  const lx = LINES.find(x => x.c === c); const dif = lx && lx.contado && lx.dif ? Math.abs(lx.dif) : 0;
  const hl = q => dif > 0 && Math.abs(Math.abs(q) - dif) <= dif * tol / 100;
  // Grilla 1: por chofer, con el desglose por origen debajo
  const porCh = {};

  return Object.entries(S.maestro).filter(([, m]) => !m.baja).filter(([c, m]) => !Q || c.includes(Q) || (m.d || '').toUpperCase().includes(Q)).slice(0, 30)

async function leerFoto(file) {
  const msg = $('#scanMsg');
  const estado = t => { msg.innerHTML = '<div class="banner info"><span class="grow">' + esc(t) + '</span></div>'; };
  estado('Leyendo el código de la foto…');
  const pasos = [];
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('No se pudo abrir la imagen (' + (file.type || 'formato desconocido') + ')')); img.src = url; });
    pasos.push('foto ' + img.naturalWidth + 'x' + img.naturalHeight);
    let code = null;
    // Recortes a probar: foto entera, franja central, centro; y en dos tamaños
    const recortes = [[0, 0, 1, 1], [0, 0.3, 1, 0.4], [0.1, 0.25, 0.8, 0.5], [0.2, 0.35, 0.6, 0.3]];
    const canvases = [];
    for (const [x, y, w, h] of recortes) for (const sc of [1, 0.5]) {
      const cw = Math.round(img.naturalWidth * w * sc), ch = Math.round(img.naturalHeight * h * sc);
      if (cw < 240 || cw > 2600) continue;
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      cv.getContext('2d').drawImage(img, img.naturalWidth * x, img.naturalHeight * y, img.naturalWidth * w, img.naturalHeight * h, 0, 0, cw, ch);
      canvases.push(cv);
    }
    if ('BarcodeDetector' in window) {
      try {
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'itf', 'code_128', 'upc_a', 'upc_e', 'code_39'] });
        for (const cv of canvases) { const r = await det.detect(cv); if (r[0]?.rawValue) { code = r[0].rawValue; break; } }
        pasos.push('detector del navegador: ' + (code ? 'leyó' : 'nada'));
      } catch (e) { pasos.push('detector del navegador falló: ' + (e.message || e)); }
    } else pasos.push('sin detector nativo');
    if (!code) {
      if (!window.ZXing) {
        estado('Cargando lector alternativo…');
        try { await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'); }
        catch { await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'); }
      }
      const Z = window.ZXing;
      const hints = new Map();
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.ITF, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_39]);
      const reader = new Z.MultiFormatReader(); reader.setHints(hints);
      for (const cv of canvases) {
        for (const rot of [false, true]) {
          let c2 = cv;
          if (rot) { c2 = document.createElement('canvas'); c2.width = cv.height; c2.height = cv.width; const g = c2.getContext('2d'); g.translate(c2.width / 2, c2.height / 2); g.rotate(Math.PI / 2); g.drawImage(cv, -cv.width / 2, -cv.height / 2); }
          try {
            const src = new Z.HTMLCanvasElementLuminanceSource(c2);
            const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(src));
            const res = reader.decode(bmp); code = res?.getText?.() || null;
          } catch { }
          if (code) break;
        }
        if (code) break;
      }
      pasos.push('lector alternativo: ' + (code ? 'leyó' : 'nada'));
    }
    if (!code) throw new Error('No encontré ningún código de barras en la foto');
    msg.innerHTML = '';
    S.ui.ultimaFoto = code; S.ui.porFoto = true;
    const sc = $('#scan'); if (sc) sc.value = code; (scanDestino || onScan)(code);
  } catch (e) {
    msg.innerHTML = '<div class="banner warn"><span class="grow">' + esc(e.message || 'No pude leer el código') + '. Probá con el código de barras ocupando buena parte de la foto, derecho y con luz, o escribí el número.<br><span class="small muted">' + esc(pasos.join(' · ')) + '</span></span></div>';
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- Escáner en vivo (cámara) ---------- */
let scanStream = null, scanLoop = null, zxReader = null, scanTrack = null;
S.scanLog = [];
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'scanLogDet') S.ui.logAbierto = e.target.open; }, true);
function scanLog(m) {
  S.scanLog.push(new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' ' + m);
  if (S.scanLog.length > 30) S.scanLog.shift();
  const el = $('#scanLogBox'); if (el) el.textContent = S.scanLog.join('\n');
}
const enMarco = () => { try { return window.top !== window.self; } catch { return true; } };
/* Dentro del marco de Google la cámara en vivo suele estar bloqueada: se abre la misma pantalla en una pestaña propia */
function abrirPantallaCompleta() {
  const url = S.appUrl || location.href;
  scanLog('abrir pantalla completa: ' + url.slice(0, 60));
  const w = window.open(url, '_blank');
  if (!w) { toast('El navegador bloqueó la ventana. Permití las ventanas emergentes para este sitio y volvé a tocar.'); return false; }
  toast('Se abrió la app a pantalla completa. Escaneá desde esa pestaña.');
  return true;
}
async function abrirEscaner() {
  scanLog('Escanear: marco=' + enMarco() + ' seguro=' + window.isSecureContext + ' mediaDevices=' + !!navigator.mediaDevices + ' getUserMedia=' + !!navigator.mediaDevices?.getUserMedia + ' detector=' + ('BarcodeDetector' in window) + ' ua=' + navigator.userAgent.slice(0, 60));
  if (!navigator.mediaDevices?.getUserMedia) { toast('Este navegador no permite usar la cámara en vivo. Usá "Foto".'); return; }
  cerrarEscaner('reabrir');
  const ov = document.createElement('div'); ov.className = 'scanner'; ov.id = 'scanner';
  ov.innerHTML = `<div style="position:relative;min-height:0"><video id="scanVideo" playsinline autoplay muted></video><div class="marco"></div></div>
    <div class="barra"><span class="small" id="scanEstado">Apuntá al código de barras</span><div class="row"><button class="btn sm" data-act="linterna">Linterna</button><button class="btn sm" data-act="cerrarEscaner">Cerrar</button></div></div>`;
  document.body.appendChild(ov);
  const video = $('#scanVideo');
  try {
    scanLog('pidiendo cámara…');
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    scanLog('cámara OK: ' + (scanStream.getVideoTracks()[0]?.label || 'sin nombre'));
  } catch (e) {
    scanLog('cámara FALLÓ: ' + (e?.name || '') + ' ' + (e?.message || e));
    // No cerrar el visor: mostrar el motivo y las salidas posibles
    clearInterval(scanLoop); try { scanStream?.getTracks().forEach(t => t.stop()); } catch { } scanStream = null;
    const nombre = e?.name || 'error';
    let por = '';
    if (enMarco() && (nombre === 'NotAllowedError' || nombre === 'SecurityError')) por = 'Google no permite usar la cámara dentro de este marco. Abrí la app a pantalla completa y escaneá desde ahí.';
    else if (nombre === 'NotAllowedError') por = 'El navegador tiene bloqueado el permiso de cámara para este sitio. Tocá el candado junto a la dirección, habilitá Cámara y volvé a intentar.';
    else if (nombre === 'NotFoundError' || nombre === 'OverconstrainedError') por = 'No se encontró una cámara en este dispositivo.';
    else if (nombre === 'NotReadableError') por = 'La cámara está en uso por otra aplicación. Cerrala y volvé a intentar.';
    else por = 'No se pudo abrir la cámara: ' + (e?.message || nombre) + '.';
    const area = ov.querySelector('div');
    area.innerHTML = `<div style="padding:24px 18px;color:#eee;display:grid;gap:14px;align-content:center;height:100%;text-align:center">
      <div style="font-size:17px;font-weight:600">${esc(por)}</div>
      <div class="small" style="opacity:.7">Detalle técnico: ${esc(nombre)}${e?.message ? ' · ' + esc(e.message) : ''}${enMarco() ? ' · dentro del marco de Google' : ' · pestaña propia'}</div>
      <div class="row" style="justify-content:center">
        ${enMarco() ? '<button class="btn pri" data-act="pantallaCompleta">Abrir a pantalla completa</button>' : ''}
        <button class="btn" data-act="escanear">Reintentar</button>
        <label class="btn cam">Usar Foto<input type="file" id="pickPhoto2" accept="image/*" capture="environment"></label>
      </div></div>`;
    $('#scanEstado').textContent = 'La cámara no se pudo abrir';
    return;
  }
  video.srcObject = scanStream; scanTrack = scanStream.getVideoTracks()[0];
  try { await video.play(); } catch { }
  let detector = null;
  scanLog('video en marcha ' + video.videoWidth + 'x' + video.videoHeight);
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'itf', 'code_128', 'upc_a', 'upc_e', 'code_39'] }); } catch { } }
  if (!detector) {
    try {
      if (!window.ZXing) { try { await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'); } catch { await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'); } }
      const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.UPC_A]);
      zxReader = new ZXing.BrowserMultiFormatReader(hints, 300);
    } catch (e) { const el = $('#scanEstado'); if (el) el.textContent = 'No se pudo cargar el lector. Usá "Foto".'; return; }
  }
  let ultimo = '', repeticiones = 0, ocupado = false;
  const aceptar = code => {
    if (code === ultimo) repeticiones++; else { ultimo = code; repeticiones = 1; }
    if (repeticiones < 2) { const el = $('#scanEstado'); if (el) el.textContent = 'Leyendo ' + code + '…'; return; }
    if (navigator.vibrate) navigator.vibrate(60);
    scanLog('código leído ' + code);
    cerrarEscaner('leído');
    S.ui.ultimaFoto = code; S.ui.porFoto = true; S.ui.porEscaner = true;
    const sc = $('#scan'); if (sc) sc.value = code;
    (scanDestino || onScan)(code);
  };
  if (detector) {
    const cv = document.createElement('canvas');
    scanLoop = setInterval(async () => {
      if (ocupado || !video.videoWidth) return; ocupado = true;
      try {
        const w = video.videoWidth, h = video.videoHeight; cv.width = Math.round(w * 0.8); cv.height = Math.round(h * 0.22);
        cv.getContext('2d').drawImage(video, w * 0.1, h * 0.35, w * 0.8, h * 0.22, 0, 0, cv.width, cv.height);
        const r = await detector.detect(cv);
        if (r[0]?.rawValue) aceptar(r[0].rawValue);
      } catch { } finally { ocupado = false; }
    }, 180);
  } else {
    zxReader.decodeFromVideoElement(video, (res) => { if (res) aceptar(res.getText()); });
  }
}
function cerrarEscaner(motivo) {
  if ($('#scanner')) scanLog('cerrar visor (' + (motivo || 'sin motivo') + ')' + (motivo ? '' : ' ' + String(new Error().stack || '').split('\n').slice(2, 4).join(' <- ').replace(/\s+/g, ' ').slice(0, 160)));
  clearInterval(scanLoop); scanLoop = null;
  try { zxReader?.reset(); } catch { } zxReader = null;
  try { scanStream?.getTracks().forEach(t => t.stop()); } catch { } scanStream = null; scanTrack = null;
  $('#scanner')?.remove();
}
async function toggleLinterna() {
  try {
    const caps = scanTrack?.getCapabilities?.();
    if (!caps?.torch) { toast('Este teléfono no permite prender la linterna desde el navegador.'); return; }
    const on = !(scanTrack.getSettings?.().torch);
    await scanTrack.applyConstraints({ advanced: [{ torch: on }] });
  } catch { toast('No se pudo cambiar la linterna.'); }
}

function editarMaestro(c, k, v) {
  draft ||= JSON.parse(JSON.stringify(S.maestro));
  const it = draft[c] ||= {};
  if (k === 'u' || k === 'o') it[k] = v === '' ? null : Number(v);
  else if (k === 'bpp' || k === 'bpb' || k === 'upb') it[k] = v === '' ? 0 : Math.max(0, Number(v) || 0);
  else if (k === 'e') it.e = v.split(/[\s,;]+/).filter(Boolean);
  else if (k === 'q') { if (v) it.q = 1; else delete it.q; }
  else it[k] = v;
}
async function guardarMaestro() {
  if (!draft) return;
  try { await API.call('guardarMaestro', draft); S.maestro = draft; draft = null; toast('Lista de artículos guardada.'); programarRefresco(300); }
  catch (e) { toast('No se guardó: ' + e.message); }
  recalc(); render();
}

/* ---------- Ajustes ---------- */
function vAjustes() {
  const list = [...S.ajustes];
  const tot = {}; for (const a of list) tot[a.c] = (tot[a.c] || 0) + Core.num(a.u);
  const sel = S.ui.ajSel ||= new Set();
  for (const id of [...sel]) if (!list.some(a => a.id === id)) sel.delete(id);
  // Agrupados por detalle (ROTO, CRÉDITO…) o por motivo (tipo de ajuste)
  const porDet = (S.ui.ajAgr || 'det') === 'det';
  const orden = Object.keys(TIPOS_AJ);
  const grupos = {};
  for (const a of list) (grupos[grupoAj(a)] ||= []).push(a);
  const claves = Object.keys(grupos).sort(porDet ? ((x, y) => (x === '' ? 1 : y === '' ? -1 : 0) || grupos[y].length - grupos[x].length || x.localeCompare(y)) : ((x, y) => (orden.indexOf(x) + 1 || 99) - (orden.indexOf(y) + 1 || 99)));
  const fila = a => `<tr class="${sel.has(a.id) ? 'sel' : ''}"><td><input type="checkbox" data-act="ajSel" data-id="${esc(a.id)}" ${sel.has(a.id) ? 'checked' : ''} aria-label="Seleccionar ajuste ${esc(a.c)}"></td><td class="code">${esc(a.c)}</td><td>${esc(S.maestro[a.c]?.d || '—')}</td><td class="n mono small">${sisTxt(a.c)}</td><td>${porDet ? esc(TIPOS_AJ[a.t]?.n || a.t) : esc(a.m)}</td><td class="n">${fmtS(Core.num(a.u))}</td><td class="n muted">${fmtS(tot[a.c])}</td><td class="small muted">${a.f ? dm(a.f) : ''}</td><td><button class="btn sm" data-act="ajDel" data-id="${esc(a.id)}" title="Borrar sin dejar registro (si se cargó por error)">Borrar</button></td></tr>`;
  const bloques = claves.map(k => {
    const g = grupos[k].sort((a, b) => (a.c || '').localeCompare(b.c || ''));
    const todos = g.every(a => sel.has(a.id));
    const suma = g.reduce((s, a) => s + Core.num(a.u), 0);
    const nombre = porDet ? (k || 'Sin detalle') : (TIPOS_AJ[k]?.n || k);
    return `<tr class="sec"><td><input type="checkbox" data-act="ajSelGrupo" data-v="${esc(k)}" ${todos ? 'checked' : ''} aria-label="Seleccionar todo el grupo"></td><td colspan="8">${esc(nombre)} <span class="muted" style="font-weight:400">· ${g.length} ajuste${g.length > 1 ? 's' : ''} · ${fmtS(suma)} u${!porDet && TIPOS_AJ[k]?.diario ? ' · se borran solos al cerrar' : ''}</span></td></tr>${g.map(fila).join('')}`;
  }).join('');

async function armLeer(file) {
  S.ui.arm = { ocupado: true, estado: 'Leyendo ' + esc(file.name) + '…' }; render();
  try {
    const buf = await file.arrayBuffer();
    const lib = await libroExcel(buf);
    const nombres = lib.SheetNames || [];
    const N = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const COLS = { c: ['codigo', 'cod', 'articulo', 'material'], bpp: ['basespallet', 'basesporpallet', 'basespale', 'basesporpale', 'bpp'], bpb: ['bultosbase', 'bultosporbase', 'bultoscamada', 'bultosporcamada', 'bpb'], upb: ['ubulto', 'unbulto', 'unidadesbulto', 'unidadesporbulto', 'unidbulto', 'upb'] };
    const orden = [...nombres].sort((a, b) => (N(b) === 'armado') - (N(a) === 'armado') || (N(b) === 'articulos') - (N(a) === 'articulos'));
    let hoja = null, aoa = null, idx = null;
    for (const n of orden) {
      const a = await lib.aoa(n); if (!a) continue;
      const hdr = (a[0] || []).map(N), ix = {};
      for (const [k, al] of Object.entries(COLS)) ix[k] = hdr.findIndex(h => al.includes(h));
      if (ix.c >= 0 && (ix.bpp >= 0 || ix.bpb >= 0 || ix.upb >= 0)) { hoja = n; aoa = a; idx = ix; break; }
    }
    if (!hoja) throw new Error('no encontré una hoja con la columna "codigo" y alguna de "bases_pallet", "bultos_base" o "u_bulto"');
    const cambios = [], noEsta = [], malos = [], vistos = new Set(); let iguales = 0;
    const val = v => { if (v === '' || v === null || v === undefined) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) && n >= 0 ? n : NaN; };
    for (const r of aoa.slice(1)) {
      const raw = String(r[idx.c] ?? '').trim(); if (!raw) continue;
      const c = Core.code(raw); if (vistos.has(c)) continue; vistos.add(c);
      const m = S.maestro[c]; if (!m) { noEsta.push(raw); continue; }
      const x = { c }; let mal = false, cambia = false;
      for (const [k, mk] of [['bpp', 'bpp'], ['bpb', 'bpb'], ['upb', 'upb']]) {
        if (idx[k] < 0) continue;
        const v = val(r[idx[k]]); if (Number.isNaN(v)) { mal = true; continue; }
        x[k] = v; if (Number(v || 0) !== Number(m[mk] || 0)) cambia = true;
      }
      if (mal) { malos.push(raw); continue; }
      if (cambia) cambios.push(x); else iguales++;
    }
    S.ui.arm = { prev: { nombre: file.name, hoja, cambios, iguales, noEsta, malos } };
  } catch (e) { S.ui.arm = { estado: '<span style="color:var(--bad)">No se pudo leer el archivo: ' + esc(e.message) + '</span>' }; }
  render();
}

async function bdLeerArchivo(file) {
  S.ui.bd = { ocupado: true, estado: 'Leyendo ' + esc(file.name) + '…' }; render();
  try {
    const barra = (pct, t) => `<div class="stack" style="gap:4px"><span>${t} · <b>${Math.round(pct)} %</b></span><div class="progreso"><div style="width:${Math.max(2, Math.min(100, pct)).toFixed(1)}%"></div></div></div>`;
    const paso = async (pct, t) => { S.ui.bd.estado = barra(pct, t); render(); await new Promise(r => setTimeout(r, 30)); };
    await paso(5, 'Abriendo ' + esc(file.name) + ' (' + fmt(Math.round(file.size / 1024)) + ' KB)');
    const buf = await file.arrayBuffer();
    const u4 = new Uint8Array(buf, 0, Math.min(4, buf.byteLength));
    if (!(u4[0] === 0x50 && u4[1] === 0x4b && XL.puede) && !window.XLSX) {
      // Excel viejo (.xls): hace falta bajar el lector de internet
      let ult = { p: 0, sitio: 1, t0: Date.now() };
      const mostrar = () => { const seg = Math.round((Date.now() - ult.t0) / 1000); S.ui.bd.estado = barra(5 + ult.p * 0.3, 'Bajando el lector de Excel de internet' + (ult.sitio > 1 ? ' (probando el sitio alternativo ' + ult.sitio + ' de 3)' : '') + (ult.p === 0 && seg >= 2 ? ' · esperando respuesta ' + seg + ' s' : '')); render(); };
      xlsxPct = (p, sitio) => { if (sitio !== ult.sitio) ult.t0 = Date.now(); ult = { ...ult, p, sitio }; mostrar(); };
      const reloj = setInterval(mostrar, 1000);
      try { await needXLSX(); } finally { xlsxPct = null; clearInterval(reloj); }
    }
    const lib = await libroExcel(buf);
    const nombres = lib.SheetNames || [];
    const buscadas = [...BD_HOJAS, ['CONFIG']].map(h => h[0]).filter(h => nombres.some(n => String(n).trim().toUpperCase() === h));
    const wb = { SheetNames: nombres, aoa: {} };
    for (const [i, h] of buscadas.entries()) {
      const nombre = nombres.find(n => String(n).trim().toUpperCase() === h);
      await paso(40 + i / Math.max(buscadas.length, 1) * 60, 'Leyendo la hoja ' + esc(nombre) + ' (' + (i + 1) + ' de ' + buscadas.length + ')');
      wb.aoa[nombre] = await lib.aoa(nombre);
    }
    await paso(100, 'Listo');
    const norm = s => String(s || '').trim().toUpperCase();
    const hojas = [];
    for (const [hoja, tabla, titulo, cols] of [...BD_HOJAS, ['CONFIG', 'config', 'Opciones y PIN', ['clave', 'valor']]]) {
      const nombre = wb.SheetNames.find(n => norm(n) === hoja); if (!nombre || !wb.aoa[nombre]) continue;
      const aoa = wb.aoa[nombre];
      const hdr = (aoa[0] || []).map(h => String(h).trim().toLowerCase());
      const faltan = cols.filter(k => !hdr.includes(k) && ['codigo', 'fecha', 'ean', 'clave'].includes(k));
      if (faltan.length) { hojas.push({ hoja, tabla, titulo, filas: [], err: 'faltan columnas: ' + faltan.join(', ') }); continue; }
      const filas = aoa.slice(1).filter(r => r.some(v => String(v).trim() !== '')).map(r => {
        const o = {}; hdr.forEach((k, i) => { if (!k) return; let v = r[i]; if (v instanceof Date || k === 'fecha') v = Core.fISO(v) || (v instanceof Date ? '' : v); o[k] = v; }); return o;
      });
      const extra = tabla === 'cierres' ? new Set(filas.map(f => f.fecha)).size + ' días' : '';
      hojas.push({ hoja, tabla, titulo, filas, extra, sel: tabla !== 'config' || true });
    }
    if (!hojas.length) throw new Error('el archivo no tiene ninguna hoja de la plantilla (ARTICULOS, AJUSTES, CIERRES, CIERRES_RESUMEN, CODIGOS)');
    S.ui.bd = { ocupado: false, prev: { nombre: file.name, hojas } };
  } catch (e) { S.ui.bd = { ocupado: false, estado: '<span style="color:var(--bad)">No se pudo leer el archivo: ' + esc(e.message) + '</span>' }; }
  render();
}
async function bdImportar() {
  const P = S.ui.bd?.prev; if (!P) return;

  const hechos = [];
  try {
    const total = sel.reduce((s, h) => s + h.filas.length, 0); let hecho = 0;
    for (const h of sel) {
      const LOTE = h.tabla === 'cierres' ? 400 : 1000;
      for (let i = 0; i < Math.max(h.filas.length, 1); i += LOTE) {

  render();
}

async function guardarDeposito(c) {
  const cj = $('#d-cj-' + CSS.escape(c))?.value, un = $('#d-un-' + CSS.escape(c))?.value;
  if (sumaDe(c).hay) {
    // Hay cajas o unidades cargadas en "+ Sumar / − Restar": eso es lo que se quiere guardar
    const kx = S.conteos[c] || {}, iguales = String(cj ?? '') === String(kx.cj ?? '') && String(un ?? '') === String(kx.un ?? '');
    if (!iguales && (cj !== '' || un !== '')) { toast('Cargaste un total nuevo arriba y también una suma abajo. Dejá solo uno de los dos.'); return; }
    return sumarDeposito(c);
  }
  if (cj === '' && un === '') { toast('Cargá cajas o unidades.'); return; }
  // Si está en modo continuo y el último artículo vino por foto, abrir la cámara ya (necesita el toque del usuario)
  let reabrirEscaner = false;
  if (S.ui.cont && S.ui.porFoto) { S.ui.porFoto = false; if (S.ui.porEscaner) reabrirEscaner = true; else { try { $('#pickPhoto')?.click(); } catch { } } }
  const nota = $('#d-n-' + CSS.escape(c))?.value;
  const patch = { cj: cj === '' ? 0 : Number(cj), un: un === '' ? 0 : Number(un), by: S.me.id, rec: false };
  if (nota !== undefined) patch.nota = nota.trim();
  const ok = await guardarConteo(c, patch);
  if (ok) {
    delete DD[c + 'cj']; delete DD[c + 'un']; delete DD[c + 'nota']; for (const k of ['pal', 'bas', 'bul', 'un']) delete DD[c + '_' + k];
    if (S.ui.detAb) delete S.ui.detAb[c];
    avisoGuardado('Guardado', S.maestro[c]?.d || c, `<b>${fmt(patch.cj)}</b> cajas · <b>${fmt(patch.un)}</b> unidades`);
    S.ui.yaContado = null; delete DD[c + 'acj']; delete DD[c + 'aun'];
    S.ui.okMsg = `✓ Guardado <b>${esc(S.maestro[c]?.d || c)}</b>: ${fmt(patch.cj)} cj ${fmt(patch.un)} u. Los ya contados se ven en "Todos".`;
    S.ui.foco = null;
    document.querySelectorAll('[data-dirty]').forEach(el => delete el.dataset.dirty);
    const sc = $('#scan'); if (sc) { sc.value = ''; S.ui.q = ''; render(); focoBusqueda(); }
    if (reabrirEscaner) setTimeout(abrirEscaner, 300);
  }
}

  if (a === 'contScan') { S.ui.cont = t.checked; try { localStorage.setItem('contScan', t.checked ? '1' : ''); } catch { } }
  if (a === 'hMes') { S.ui.hist.mes = t.value; S.ui.hist.abierto = null; cargarHist(); }
