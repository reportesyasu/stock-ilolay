<script>
/* Atrapa cualquier error de arranque y lo muestra en pantalla, para no quedar en "Cargando…" sin explicación */
window.__VERSION = 'sb1';
window.__errs = [];
function __mostrarErrores() {
  var m = document.getElementById('main'); if (!m) return;
  m.innerHTML = '<div style="padding:16px;font-family:monospace;white-space:pre-wrap;color:#b3362c"><b>Errores al iniciar (' + window.__VERSION + ')</b>\n' + window.__errs.join('\n----\n') + '</div>';
}
window.addEventListener('error', function (e) {
  var src = e.filename ? e.filename.split('/').pop().split('?')[0] : '';
  window.__errs.push((e.message || e) + '\nlínea ' + e.lineno + ':' + e.colno + (src ? ' (' + src + ')' : '') + '\n' + (e.error && e.error.stack ? e.error.stack.split('\n').slice(0, 3).join('\n') : ''));
  __mostrarErrores();
});
window.addEventListener('unhandledrejection', function (e) {
  var m = document.getElementById('main'); if (!m || !/Cargando/.test(m.textContent)) return;
  var r = e.reason || {};
  window.__errs.push('(promesa) ' + (r.message || r) + '\n' + (r.stack ? r.stack.split('\n').slice(0, 3).join('\n') : ''));
  __mostrarErrores();
});
</script>

"use strict";
/* Datos del proyecto de Supabase (Settings → API Keys). Si quedan vacíos, la pantalla de Acceso los pide. */
const SB_URL = 'https://trznygnvycexiynwcojz.supabase.co';
const SB_KEY = 'sb_publishable_n2MEG_upNoZC_qpkd5MHmw_KP9gt_6s';
const APP_URL_FIJA = SB_URL && SB_KEY ? SB_URL : '';
/* ===== Núcleo: lectura de archivos y cálculo de stock (sin dependencias) ===== */
const Core = (() => {
  const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ' };
  function decodeEnt(s) {
    return s.replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi, (m, e) => {
      if (e[0] === '#') return String.fromCodePoint(e[1].toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
      return ENT[e.toLowerCase()] ?? m;
    });
  }
  function clean(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/ /g, ' ').trim();
  }
  /* Número tolerante: "1.915,000", "1,915.00", "12-" (negativo SAP), "'45" */
  function num(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    let s = clean(v).replace(/^'/, '').replace(/\s/g, '');
    if (!s) return 0;
    let neg = false;
    if (/-$/.test(s)) { neg = true; s = s.slice(0, -1); }
    if (/^-/.test(s)) { neg = !neg; s = s.slice(1); }
    const hasDot = s.includes('.'), hasComma = s.includes(',');
    if (hasDot && hasComma) {
      if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
      else s = s.replace(/,/g, '');
    } else if (hasComma) {
      s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
    } else if (hasDot && /^\d{1,3}(\.\d{3})+$/.test(s)) {
      s = s.replace(/\./g, '');
    }
    const n = parseFloat(s);
    return isFinite(n) ? (neg ? -n : n) : 0;
  }
  /* Código de artículo: sin apóstrofo, sin ceros a la izquierda si es numérico */
  function code(v) {
    let s = clean(v).replace(/^'+/, '').toUpperCase();
    if (/^\d+(\.0+)?$/.test(s)) s = String(parseInt(s, 10));
    return s;
  }

  /* ---- Texto a filas: HTML (xls "disfrazado"), TSV, CSV ---- */
  function rowsFromHtml(text) {
    const rows = [];
    const trRe = /<tr[^>]*>([\s\S]*?)(?=<tr[\s>]|<\/table|$)/gi;
    let m;
    while ((m = trRe.exec(text))) {
      const cells = [];
      const tdRe = /<t([dh])([^>]*)>([\s\S]*?)(?=<t[dh][\s>]|<\/tr|$)/gi;
      let c;
      while ((c = tdRe.exec(m[1]))) {
        const val = decodeEnt(c[3].replace(/<\/t[dh]>[\s\S]*$/i, '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '')).replace(/\s+/g, ' ').trim();
        cells.push(val);
        const cs = /colspan\s*=\s*["']?(\d+)/i.exec(c[2]);
        if (cs) for (let k = 1; k < Math.min(+cs[1], 60); k++) cells.push('');
      }
      if (cells.length) rows.push(cells);
    }
    return rows;
  }
  function rowsFromDelimited(text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    const sample = lines.slice(0, 40).join('\n');
    const count = ch => (sample.match(new RegExp(ch === '|' ? '\\|' : ch, 'g')) || []).length;
    const cand = ['\t', ';', '|', ','].map(ch => [ch, count(ch)]).sort((a, b) => b[1] - a[1]);
    const sep = cand[0][1] > 0 ? cand[0][0] : '\t';
    return lines.map(line => {
      if (sep !== ',' && sep !== ';') return line.split(sep).map(clean);
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
        else if (ch === '"') q = true;
        else if (ch === sep) { out.push(clean(cur)); cur = ''; }
        else cur += ch;
      }
      out.push(clean(cur));
      return out;
    }).filter(r => r.some(c => c !== '') && !r.every(c => /^[-=\s]*$/.test(c)))
      .map(r => (sep === '|' && r[0] === '' ? r.slice(1) : r));

function decodeText(buf) {
  const u8 = new Uint8Array(buf);
  let t = new TextDecoder('utf-8').decode(u8);
  const head = t.slice(0, 3000);
  const meta = /charset\s*=\s*["']?([\w-]+)/i.exec(head);
  if ((meta && !/utf-?8/i.test(meta[1])) || (t.match(/\uFFFD/g) || []).length > 2) t = new TextDecoder('windows-1252').decode(u8);
  return t;
}
async function fileRows(file) {
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf.slice(0, 4));
  const isZip = u8[0] === 0x50 && u8[1] === 0x4b, isOle = u8[0] === 0xd0 && u8[1] === 0xcf;
  if (isZip || isOle) {
    await needXLSX();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    let best = null;
    for (const n of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' });
      const info = Core.detect(rows);
      if (info.kind !== 'desconocido') { if (!best || (best.info.kind === 'mov' && info.kind !== 'mov')) best = { rows, info }; }
    }
    if (best) return best;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
    return { rows, info: Core.detect(rows) };
  }
  const rows = Core.rowsFromText(decodeText(buf));
  return { rows, info: Core.detect(rows) };
}
async function leerArchivos(list) {
  const files = [...list].filter(f => !/^~\$|^\./.test(f.name) && /\.(xls|xlsx|xlsm|csv|txt|htm|html|tsv)$/i.test(f.name));
  if (!files.length) { toast('No encontré archivos de Excel, CSV o texto en la carpeta.'); return; }
  files.sort((a, b) => b.lastModified - a.lastModified);
  const found = { sap: null, yasu: null, mov: null }; const err = [];
  for (const f of files) {
    try {
      const { rows, info } = await fileRows(f);
      if (info.kind === 'desconocido' || found[info.kind]) { if (info.kind === 'desconocido') err.push(f.name); continue; }
      const meta = { name: f.name, mod: f.lastModified, path: f.webkitRelativePath || f.name };
      if (info.kind === 'sap') found.sap = { ...meta, data: Core.buildSap(rows, info, opt('excluir')) };
      if (info.kind === 'yasu') {
        const ses = rows.slice(0, info.h).map(r => r.join(' ')).join(' ');
        const fx = /Fecha:\s*([\d/-]+)\s*\|?\s*Hora:\s*([\d:]+)/i.exec(ses);
        found.yasu = { ...meta, data: Core.buildYasu(rows, info, opt('prefijo')), export: fx ? fx[1] + ' ' + fx[2] : '' };
      }
      if (info.kind === 'mov') found.mov = { ...meta, data: Core.buildMov(rows, info) };
    } catch (e) { err.push(f.name + ' (' + (e.message || 'no se pudo leer') + ')'); }
  }
  for (const k of ['sap', 'yasu', 'mov']) if (found[k]) S.files[k] = found[k];
  S.fileErr = err;
  recalc(); render();
  publicarSistema();
  const n = ['sap', 'yasu', 'mov'].filter(k => found[k]).length;
  toast(n ? 'Archivos actualizados (' + n + ' reconocidos).' : 'Ningún archivo coincide con SAP, Yasukawa o facturación.');
}

function vConfirmCierre(r) {

function tablaHoy(lines, sis, cerrado) {

    const cls = [l.contado && l.dif < 0 ? 'difneg' : '', l.contado && l.dif > 0 ? 'difpos' : '', l.rec ? 'rec' : ''].join(' ');
    const inCj = cerrado ? fmt(l.contCj) : `<input type="number" inputmode="numeric" class="cj" id="a-cj-${esc(l.c)}" data-act="cnt" data-c="${esc(l.c)}" data-k="cj" value="${l.contCj ?? ''}" aria-label="Cajas contadas ${esc(l.c)}">`;
    const inUn = cerrado ? fmt(l.contUn) : `<input type="number" inputmode="numeric" class="un" id="a-un-${esc(l.c)}" data-act="cnt" data-c="${esc(l.c)}" data-k="un" value="${l.contUn ?? ''}" aria-label="Unidades contadas ${esc(l.c)}">`;
    const ayer = l.prevDif ? `<span class="${l.prevDif < 0 ? 'pill bad' : 'pill ok'}" title="${esc(l.prevMotivo)}">${fmtS(l.prevDif)}</span>` : '';
    rows += `<tr class="${cls}">
      <td><span class="code">${esc(l.c)}</span></td>
      <td class="desc"><button class="link" data-act="det" data-c="${esc(l.c)}">${esc(l.d)}</button>${l.q ? (l.metodo === 'variacion' ? ' <span class="pill seco" title="Contado al cierre anterior más la variación de SAP y Yasukawa desde entonces">queso · variación</span>' : l.metodo === 'manual' ? ' <span class="pill seco" title="Contado al cierre anterior más variación de Yasukawa y la facturación Ilolay cargada a mano">queso · manual</span>' : ' <span class="pill seco" title="Se parte del cierre anterior; falta el dato de kilos del cierre para usar la variación">queso · arrastre</span>') : ''}${l.rec ? ' <span class="pill warn">recontar</span>' : ''}<div class="small muted">x${l.uxc}${l.por ? ' · contó ' + esc(nom(l.por)) : ''}${l.ok ? ` · <span style="color:var(--ok)">✓ verificado ${hora(l.okTs)}</span>` : ''}${l.ok && l.cambio ? ` · sistema ahora ${fmtS(l.cambio)} u (${fmt(Core.split(l.sisVivo, l.uxc).cj)} cj ${fmt(Core.split(l.sisVivo, l.uxc).un)} u)` : ''}</div>${sis ? `<div class="only-sm mono" style="font-size:13.5px"><span class="muted">Sistema</span> <b>${fmt(l.sisCj)}</b> cj <b>${fmt(l.sisUn)}</b> u${l.contado && l.dif ? ` · <span class="muted">dif</span> <b style="color:${l.dif < 0 ? 'var(--bad)' : 'var(--ok)'}">${fmtS(l.dif)}</b>` : ''}</div>` : ''}${l.nota ? `<div style="color:var(--warn);font-size:15px;font-weight:500">Depósito: “${esc(l.nota)}”</div>` : ''}</td>
      <td class="n hide-sm">${sis ? `${fmt(l.sisCj)} <span class="muted">cj</span> ${fmt(l.sisUn)} <span class="muted">u</span>` : '—'}</td>
      <td class="n"><span class="cnt">${inCj}<span>cj</span>${inUn}<span>u</span></span></td>
      <td class="n dif">${sis && l.contado ? (l.dif ? fmtS(l.dif) : '<span class="muted">0</span>') : ''}</td>
      <td class="n hide-sm">${sis && l.contado && l.dif ? money(l.importe) : ''}</td>
      <td>${l.contado && l.dif ? motivoSel('a-m-' + l.c, l.motivo, false).replace('data-act="motivo"', `data-act="motivo" data-c="${esc(l.c)}"`) : ''}</td>
      <td class="hide-sm">${l.contado && l.dif ? `<input type="text" class="obs" id="a-o-${esc(l.c)}" data-act="obs" data-c="${esc(l.c)}" value="${esc(l.obs)}" placeholder="Observación">` : ''}</td>
      <td class="n hide-sm">${ayer}</td>
      <td>${cerrado ? '' : `<div class="row" style="flex-wrap:nowrap;gap:4px">${sis && !l.contado ? `<button class="btn sm" data-act="igual" data-c="${esc(l.c)}" title="Cargar el contado igual al sistema">= sist.</button>` : ''}${sis && l.contado && l.dif ? `<button class="btn sm" data-act="aStock" data-c="${esc(l.c)}" title="Dar por bueno el stock del sistema: el contado pasa a ser igual al sistema">Stock</button><button class="btn sm" data-act="aConteo" data-c="${esc(l.c)}" title="Dar por bueno el conteo: crea un ajuste para que el sistema quede igual a lo contado">Conteo</button><button class="btn sm" data-act="aAjuste" data-c="${esc(l.c)}" title="Ir a Ajustes con este artículo">Ajuste</button>` : ''}<button class="btn sm" data-act="rec" data-c="${esc(l.c)}" aria-pressed="${l.rec}" title="Pedir al depósito que lo vuelva a contar">${l.rec ? 'Quitar recuento' : 'Recontar'}</button></div>`}</td>
    </tr>`;
  }
  return `<div class="tablebox"><table><thead><tr><th>Código</th><th>Descripción</th><th class="n hide-sm">Sistema</th><th class="n">Contado</th><th class="n">Dif. u</th><th class="n hide-sm">Valorizado</th><th>Motivo</th><th class="hide-sm">Obs.</th><th class="n hide-sm">Ayer</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;

    : (l.q ? (l.metodo === 'manual'
        ? `Contado al cierre del ${dm(S.anteriorFecha)}: ${fmt(l.prevCont)} hormas<br>+ variación Yasukawa: ${fmt(l.yasu)} − ${fmt(l.prevYa)} = ${fmtS(l.varYa)}<br>+ facturación Ilolay cargada a mano (ajustes del día): ver abajo<br>= ${fmt(l.base)}`
        : l.metodo === 'variacion'
        ? `Contado al cierre del ${dm(S.anteriorFecha)}: ${fmt(l.prevCont)} hormas<br>+ variación SAP: (${fmt(l.sapRaw)} kg − ${fmt(l.prevSk)} kg) ÷ ${fmt(l.peso)} kg = ${fmtS(l.varSap)}<br>+ variación Yasukawa: ${fmt(l.yasu)} − ${fmt(l.prevYa)} = ${fmtS(l.varYa)}<br>= ${fmt(l.base)}`
        : `Cierre anterior (${dm(S.anteriorFecha)}) ${fmt(l.base)} <span class="muted">(arrastre: el cierre anterior no tiene los kilos de SAP; desde el próximo cierre se usa la variación)</span>`)
      : `SAP ${fmt(l.sap)} + Yasukawa ${fmt(l.yasu)}`) + ` + ajustes ${fmt(l.aj)}<br>= <b>${fmt(l.sis)} u</b> = ${fmt(l.sisCj)} cj + ${fmt(l.sisUn)} u (x${l.uxc})${l.contado ? `<br>Contado ${fmt(l.contCj)} cj + ${fmt(l.contUn)} u = ${fmt(l.cont)} u → diferencia <b>${fmtS(l.dif)} u</b>${l.precio ? ' × ' + money2(l.precio) + ' = ' + money(l.importe) : ''}` : ''}`;

/* ---------- Contar (depósito) ---------- */
function vContar() {
  const cerrado = !!S.cierre;
  const items = Object.entries(S.maestro).filter(([, m]) => !m.baja).map(([c, m]) => ({ c, ...m })).sort((a, b) => (a.s || '').localeCompare(b.s || '') || (a.o ?? 999) - (b.o ?? 999));
  if (!items.length) return `<div class="panel empty">Todavía no hay artículos para contar. ${S.admin ? 'Agregalos en <button class="link" data-act="tab" data-v="maestro">Artículos</button>.' : 'Avisale a administración.'}</div>`;
  const q = S.ui.q.trim().toUpperCase();
  const k = c => S.conteos[c];
  const contado = c => { const x = k(c); return x && (x.cj !== null && x.cj !== undefined || x.un !== null && x.un !== undefined); };
  const sec = items.filter(i => S.ui.sector === 'TODOS' || i.s === S.ui.sector);
  const hechos = sec.filter(i => contado(i.c)).length, rec = sec.filter(i => k(i.c)?.rec).length;
  const vis = sec.filter(i => {
    if (S.ui.foco === i.c) return true;
    if (S.ui.solo === 'pend' && contado(i.c) && !k(i.c)?.rec) return false;
    if (S.ui.solo === 'rec' && !k(i.c)?.rec) return false;
    if (q && !(i.c.includes(q) || (i.d || '').toUpperCase().includes(q) || (i.e || []).includes(q))) return false;
    return true;
  });
  const card = i => {
    const x = k(i.c), done = contado(i.c);
    return `<div class="card ${done ? 'done' : ''} ${x?.rec ? 'rec' : ''} ${S.ui.foco === i.c ? 'focus' : ''}" id="card-${esc(i.c)}">
      <div class="t"><b>${esc(i.d)}</b><div class="meta"><span class="mono">${esc(i.c)}</span><span>x${i.u || 1} por caja</span><span class="pill ${i.s === 'FRIO' ? 'frio' : 'seco'}">${i.s === 'FRIO' ? 'Frío' : 'Seco'}</span>${x?.rec ? '<span class="pill warn">Volver a contar</span>' : ''}</div></div>
      <div class="val">${done ? `${fmt(x.cj ?? 0)} cj ${fmt(x.un ?? 0)} u<div class="small muted">${esc(nom(x.by))} ${hora(x.ts)}</div>` : '<span class="muted small">sin contar</span>'}${cerrado && x?.nota ? `<div class="small">“${esc(x.nota)}”</div>` : ''}</div>
      ${cerrado ? '' : `<div class="in"><label>Cajas<input type="number" inputmode="numeric" id="d-cj-${esc(i.c)}" data-act="dcnt" data-c="${esc(i.c)}" data-k="cj" value="${esc(DD[i.c + 'cj'] ?? x?.cj ?? '')}"></label><label>Unidades<input type="number" inputmode="numeric" id="d-un-${esc(i.c)}" data-act="dcnt" data-c="${esc(i.c)}" data-k="un" value="${esc(DD[i.c + 'un'] ?? x?.un ?? '')}"></label><button class="btn pri" data-act="dsave" data-c="${esc(i.c)}" style="align-self:end">Guardar</button></div>
      ${x?.rec || x?.nota ? `<label class="small muted" style="grid-column:1/-1;display:grid;gap:3px">Nota para administración (este artículo)<input type="text" id="d-n-${esc(i.c)}" data-act="dnota" data-c="${esc(i.c)}" value="${esc(DD[i.c + 'nota'] ?? x?.nota ?? '')}" placeholder="Ej.: 2 cajas rotas, estaban en otro pasillo…" style="width:100%"></label>` : ''}`}
    </div>`;
  };
  const pct = sec.length ? Math.round(hechos / sec.length * 100) : 0;
  return `<div class="stack">
    ${cerrado ? `<div class="banner ok"><span class="grow">El stock del ${dm(S.dia)} ya está cerrado. No se pueden cargar más conteos para ese día.</span></div>` : ''}
    ${enMarco() ? `<div class="banner info"><span class="grow">Si la cámara no abre, es porque Google la bloquea dentro de este marco: abrí la app a pantalla completa y escaneá desde ahí.</span><button class="btn pri sm" data-act="pantallaCompleta">Abrir a pantalla completa</button></div>` : ''}
    <div class="scan">
      <div class="bar"><input type="search" id="scan" data-act="scan" placeholder="Escaneá el código de barras o escribí código / nombre" autocomplete="off" enterkeyhint="search" value="${esc(S.ui.q)}"><button class="btn pri" data-act="escanear" title="Escanear con la cámara en vivo">Escanear</button><label class="btn cam" title="Si la cámara en vivo no funciona: sacar una foto del código">Foto<input type="file" id="pickPhoto" accept="image/*" capture="environment"></label></div>
      <div class="row small" style="justify-content:space-between"><label class="row" style="gap:6px"><input type="checkbox" id="contScan" data-act="contScan" ${S.ui.cont ? 'checked' : ''}> Después de guardar, volver a escanear</label>${S.ui.ultimaFoto ? '<span class="muted">Último código leído: <b class="mono">' + esc(S.ui.ultimaFoto) + '</b></span>' : ''}</div>
      <div class="row" style="justify-content:space-between">${chipsSector(items)}
        <div class="chips">${[['pend', 'Pendientes'], ['rec', 'Recontar' + (rec ? ' ' + rec : '')], ['todos', 'Todos']].map(([v, n]) => `<button class="chip" data-act="solo" data-v="${v}" aria-pressed="${S.ui.solo === v}">${n}</button>`).join('')}</div></div>
      <div class="row small"><span><b class="mono">${hechos}</b> de <b class="mono">${sec.length}</b> contados</span><div class="prog" style="flex:1;min-width:120px"><i style="width:${pct}%"></i></div></div>
    </div>
    <div id="scanMsg"></div>
    ${S.scanLog.length ? `<details class="panel small" open><summary>Registro de la cámara (para diagnóstico)</summary><pre id="scanLogBox" class="mono" style="white-space:pre-wrap;margin:8px 0 0;font-size:12px">${esc(S.scanLog.join('\n'))}</pre><button class="btn sm" data-act="copiarLog">Copiar registro</button></details>` : ''}
    <div class="cards">${vis.length ? vis.map(card).join('') : `<div class="panel empty">${S.ui.solo === 'pend' ? 'No queda nada pendiente en este sector.' : 'No hay artículos con este filtro.'}</div>`}</div>
  </div>`;
}
function buscarCodigo(raw) {
  const s = Core.clean(raw).replace(/^'+/, '');
  if (!s) return null;
  const up = s.toUpperCase();
  const M = S.maestro;
  if (M[Core.code(up)]) return Core.code(up);
  const eanMap = {};
  for (const [c, m] of Object.entries(M)) for (const e of m.e || []) eanMap[e] = c;
  Object.assign(eanMap, S.codigos);
  const tries = [s, s.replace(/^0+/, '')];
  const e13 = Core.ean13FromDun(s); if (e13) tries.push(e13);
  if (/^\d{14}$/.test(s)) tries.push(s.slice(1));
  for (const t of tries) if (eanMap[t]) return eanMap[t];
  return null;
}
function onScan(val) {
  const c = buscarCodigo(val);
  const msg = $('#scanMsg');
  if (c) {
    S.ui.foco = c; S.ui.q = '';

async function leerFoto(file) {
  const msg = $('#scanMsg');
  const estado = t => { msg.innerHTML = '<div class="banner info"><span class="grow">' + esc(t) + '</span></div>'; };
  estado('Leyendo el código de la foto…');
  const pasos = [];
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('No se pudo abrir la imagen (' + (file.type || 'formato desconocido') + ')')); img.src = url; });
    pasos.push('foto ' + img.naturalWidth + 'x' + img.naturalHeight);
    let code = null;
    // Recortes a probar: foto entera, franja central, centro; y en dos tamaños
    const recortes = [[0, 0, 1, 1], [0, 0.3, 1, 0.4], [0.1, 0.25, 0.8, 0.5], [0.2, 0.35, 0.6, 0.3]];
    const canvases = [];
    for (const [x, y, w, h] of recortes) for (const sc of [1, 0.5]) {
      const cw = Math.round(img.naturalWidth * w * sc), ch = Math.round(img.naturalHeight * h * sc);
      if (cw < 240 || cw > 2600) continue;
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      cv.getContext('2d').drawImage(img, img.naturalWidth * x, img.naturalHeight * y, img.naturalWidth * w, img.naturalHeight * h, 0, 0, cw, ch);
      canvases.push(cv);
    }
    if ('BarcodeDetector' in window) {
      try {
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'itf', 'code_128', 'upc_a', 'upc_e', 'code_39'] });
        for (const cv of canvases) { const r = await det.detect(cv); if (r[0]?.rawValue) { code = r[0].rawValue; break; } }
        pasos.push('detector del navegador: ' + (code ? 'leyó' : 'nada'));
      } catch (e) { pasos.push('detector del navegador falló: ' + (e.message || e)); }
    } else pasos.push('sin detector nativo');
    if (!code) {
      if (!window.ZXing) {
        estado('Cargando lector alternativo…');
        try { await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'); }
        catch { await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'); }
      }
      const Z = window.ZXing;
      const hints = new Map();
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.ITF, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_39]);
      const reader = new Z.MultiFormatReader(); reader.setHints(hints);
      for (const cv of canvases) {
        for (const rot of [false, true]) {
          let c2 = cv;
          if (rot) { c2 = document.createElement('canvas'); c2.width = cv.height; c2.height = cv.width; const g = c2.getContext('2d'); g.translate(c2.width / 2, c2.height / 2); g.rotate(Math.PI / 2); g.drawImage(cv, -cv.width / 2, -cv.height / 2); }
          try {
            const src = new Z.HTMLCanvasElementLuminanceSource(c2);
            const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(src));
            const res = reader.decode(bmp); code = res?.getText?.() || null;
          } catch { }
          if (code) break;
        }
        if (code) break;
      }
      pasos.push('lector alternativo: ' + (code ? 'leyó' : 'nada'));
    }
    if (!code) throw new Error('No encontré ningún código de barras en la foto');
    msg.innerHTML = '';
    S.ui.ultimaFoto = code; S.ui.porFoto = true;
    $('#scan').value = code; onScan(code);
  } catch (e) {
    msg.innerHTML = '<div class="banner warn"><span class="grow">' + esc(e.message || 'No pude leer el código') + '. Probá con el código de barras ocupando buena parte de la foto, derecho y con luz, o escribí el número.<br><span class="small muted">' + esc(pasos.join(' · ')) + '</span></span></div>';
  } finally { URL.revokeObjectURL(url); }
}

let scanStream = null, scanLoop = null, zxReader = null, scanTrack = null;

const enMarco = () => { try { return window.top !== window.self; } catch { return true; } };
/* Dentro del marco de Google la cámara en vivo suele estar bloqueada: se abre la misma pantalla en una pestaña propia */

async function abrirEscaner() {

    const nombre = e?.name || 'error';
    let por = '';

    else if (nombre === 'NotAllowedError') por = 'El navegador tiene bloqueado el permiso de cámara para este sitio. Tocá el candado junto a la dirección, habilitá Cámara y volvé a intentar.';
    else if (nombre === 'NotFoundError' || nombre === 'OverconstrainedError') por = 'No se encontró una cámara en este dispositivo.';

    const area = ov.querySelector('div');
    area.innerHTML = `<div style="padding:24px 18px;color:#eee;display:grid;gap:14px;align-content:center;height:100%;text-align:center">
      <div style="font-size:17px;font-weight:600">${esc(por)}</div>
      <div class="small" style="opacity:.7">Detalle técnico: ${esc(nombre)}${e?.message ? ' · ' + esc(e.message) : ''}${enMarco() ? ' · dentro del marco de Google' : ' · pestaña propia'}</div>
      <div class="row" style="justify-content:center">
        ${enMarco() ? '<button class="btn pri" data-act="pantallaCompleta">Abrir a pantalla completa</button>' : ''}
        <button class="btn" data-act="escanear">Reintentar</button>

      </div></div>`;
    $('#scanEstado').textContent = 'La cámara no se pudo abrir';
    return;
  }
  video.srcObject = scanStream; scanTrack = scanStream.getVideoTracks()[0];
  try { await video.play(); } catch { }

  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'itf', 'code_128', 'upc_a', 'upc_e', 'code_39'] }); } catch { } }
  if (!detector) {
    try {
      if (!window.ZXing) { try { await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'); } catch { await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'); } }
      const hints = new Map(); hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.UPC_A]);

async function cerrarDia() {
  const r = resumen(LINES);
  const lineas = LINES.map(l => ({ c: l.c, d: l.d, s: l.s, u: l.uxc, q: l.q ? 1 : 0, sap: l.sap, ya: l.yasu, sk: l.sapRaw, pe: l.peso, aj: l.aj, sis: l.sis, cont: l.contado ? l.cont : null, dif: l.contado ? l.dif : 0, m: l.contado && l.dif ? l.motivo : '', obs: l.obs || '', nota: l.nota || '', imp: l.importe || 0, por: l.por || null }));
  const doc = { fecha: S.dia, origen: 'app', por: S.me.id, ts: Date.now(), lineas, archivos: { sap: S.files.sap?.name || '', yasu: S.files.yasu?.name || '', mov: S.files.mov?.name || '' }, resumen: { articulos: lineas.length, contados: r.contados, conDif: r.dif, sobra: r.sobra, falta: r.falta, importe: Math.round(r.imp * 100) / 100 } };
  clearTimeout(okT); clearTimeout(autoRecT);
  while (loteEnCurso) await sleep(100);
  try { await API.call('cerrarDia', doc); }
  catch (e) { toast('No se pudo guardar el cierre: ' + e.message); return; }
  S.ui.confirm = false; toast('Stock del ' + dm(S.dia) + ' cerrado y guardado.');
  S.files = { sap: null, yasu: null, mov: null }; S.remoto = null;
  await refrescar();
}
function filasExport(lineas) {
  return lineas.map(l => {
    const u = l.u || 1, s = Core.split(l.sis, u), c = l.cont === null || l.cont === undefined ? null : Core.split(l.cont, u);
    return { 'CODIGO': l.c, 'DESCRIPCION': l.d, 'SECTOR': l.s, 'UXC': u, 'SISTEMA CAJAS': s.cj, 'SISTEMA UN': s.un, 'CONTADO CAJAS': c ? c.cj : '', 'CONTADO UN': c ? c.un : '', 'DIF UN': l.cont === null || l.cont === undefined ? '' : l.dif, 'MOTIVO': l.m || '', 'OBS': l.obs || '', 'NOTA DEPOSITO': l.nota || '', 'IMPORTE': l.imp || 0 };
  });
}
function descargar(nombre, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nombre; a.rel = 'noopener'; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
async function exportar(cierre) {
  const nombre = 'STOCK ILOLAY ' + dm(cierre.fecha).replace('/', ' ');
  try {
    await needXLSX();
    const wb = XLSX.utils.book_new();
    for (const sec of ['FRIO', 'SECO']) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(filasExport((cierre.lineas || []).filter(l => l.s === sec))), sec);
    const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    descargar(nombre + '.xlsx', new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  } catch (e) {
    const rows = filasExport(cierre.lineas || []);
    const csv = [Object.keys(rows[0] || {}).join(';'), ...rows.map(r => Object.values(r).map(v => `"${String(v).replace(/"/g, '""')}"`).join(';'))].join('\r\n');
    descargar(nombre + '.csv', new Blob(['\uFEFF' + csv], { type: 'text/csv' }));
  }
}
async function copiarMail() {
  const c = S.cierre; if (!c) return;
  const dif = (c.lineas || []).filter(l => l.dif);
  const sob = dif.filter(l => l.dif > 0), fal = dif.filter(l => l.dif < 0);
  const ln = l => `${l.c} ${l.d}: ${fmtS(l.dif)} u${l.m ? ' (' + l.m + ')' : ''}${l.nota ? ' — depósito: ' + l.nota : ''}`;
  const txt = `${opt('destinatarios') ? 'Para: ' + opt('destinatarios') + '\n' : ''}Asunto: ${opt('asunto')} ${dmy(c.fecha).replace(/\//g, '.')}\n\nStock Ilolay del ${diaSem(c.fecha)} ${dmy(c.fecha)}: ${c.resumen?.contados ?? ''} artículos contados, ${dif.length} con diferencia.\n\nSOBRA:\n${sob.map(ln).join('\n') || '-'}\n\nFALTA:\n${fal.map(ln).join('\n') || '-'}\n\nValorizado: ${money(c.resumen?.importe)}`;
  try { await navigator.clipboard.writeText(txt); toast('Resumen copiado. Pegalo en el mail.'); }
  catch { S.ui.mailTxt = txt; $('#sheet').innerHTML = `<div class="sheet" data-act="cerrarDet"><div class="box" data-stop="1"><h3>Resumen para el mail</h3><textarea id="mailTxt" style="min-height:320px">${esc(txt)}</textarea><button class="btn" data-act="cerrarDet">Cerrar</button></div></div>`; $('#mailTxt').select(); }

  const patch = { cj: cj === '' ? 0 : Number(cj), un: un === '' ? 0 : Number(un), by: S.me.id, rec: false };
  if (nota !== undefined) patch.nota = nota.trim();
  const ok = await guardarConteo(c, patch);

    if (S.cierre) await corregirCierre(c, { m: t.value }); else await guardarConteo(c, { m: t.value });
  }
  if (a === 'obs') { delete t.dataset.dirty; await guardarConteo(c, { obs: t.value }); }
  if (a === 'mset') { editarMaestro(c, t.dataset.k, t.value); delete t.dataset.dirty; render(); }
  if (a === 'contScan') { S.ui.cont = t.checked; try { localStorage.setItem('contScan', t.checked ? '1' : ''); } catch { } }
  if (a === 'hMes') { S.ui.hist.mes = t.value; S.ui.hist.abierto = null; cargarHist(); }
});
async function corregirCierre(c, patch) {
  const lineas = (S.cierre.lineas || []).map(l => (l.c === c ? { ...l, ...patch } : l));
  S.cierre.lineas = lineas; render();
  try { await API.call('corregirCierre', S.dia, c, patch); toast('Cierre corregido.'); } catch (er) { toast('No se pudo corregir el cierre: ' + er.message); }
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && S.ui.det) { S.ui.det = null; $('#sheet').innerHTML = ''; }
  if (e.key === 'Escape' && $('#scanner')) cerrarEscaner('tecla Escape');
  if (e.key !== 'Enter') return;
  if (t.id === 'scan') { e.preventDefault(); onScan(t.value); }
  if (t.dataset?.act === 'dcnt') {
    e.preventDefault();
    if (t.dataset.k === 'cj') document.getElementById('d-un-' + t.dataset.c)?.focus();
    else if (document.getElementById('d-n-' + t.dataset.c)) document.getElementById('d-n-' + t.dataset.c).focus();
    else guardarDeposito(t.dataset.c);
  }
  if (t.dataset?.act === 'dnota') { e.preventDefault(); guardarDeposito(t.dataset.c); }
  if (t.dataset?.act === 'cnt') { e.preventDefault(); t.blur(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'fAcceso') { entrar(e); return; }
  if (e.target.id === 'fAj') {
    const c = Core.code($('#ajC').value), t = $('#ajT').value; let u = Core.num($('#ajU').value);
    if (!c || !u) { toast('Completá código y unidades.'); return; }
    const sg = TIPOS_AJ[t].sign; if (sg) u = sg * Math.abs(u);
    try { await API.call('agregarAjuste', { c, u, t, m: $('#ajM').value.trim(), f: S.dia }); e.target.reset(); toast('Ajuste agregado.'); programarRefresco(200); } catch (er) { toast('No se guardó: ' + er.message); }
  }
  if (e.target.id === 'fOpt') {
    const data = { ...S.opciones, prefijo: $('#oPre').value.trim(), excluir: $('#oExc').value.split(',').map(s => s.trim()).filter(Boolean), motivos: $('#oMot').value.split('\n').map(s => s.trim()).filter(Boolean), destinatarios: $('#oDest').value.trim(), autoRec: $('#oAuto').checked, quesoSap: document.querySelector('input[name=oQ]:checked')?.value || 'auto', ts: Date.now() };
    try { await API.call('guardarOpciones', data); S.opciones = data; toast('Opciones guardadas. Volvé a leer los archivos para aplicarlas.'); recalc(); render(); } catch (er) { toast('No se pudieron guardar las opciones: ' + er.message); }
  }
});
$('#pickFolder').addEventListener('change', e => { const fs = [...e.target.files]; if (fs.length) { S.carpeta = (fs[0].webkitRelativePath || '').split('/')[0] || 'carpeta'; leerArchivos(fs.filter(f => (f.webkitRelativePath || '').split('/').length <= 2)); } e.target.value = ''; });
$('#pickFiles').addEventListener('change', e => { if (e.target.files.length) leerArchivos(e.target.files); e.target.value = ''; });
document.addEventListener('change', e => { if (e.target.id === 'pickPhoto' || e.target.id === 'pickPhoto2') { const f = e.target.files[0]; if (e.target.id === 'pickPhoto2') cerrarEscaner('usar foto'); if (f) leerFoto(f); e.target.value = ''; } });
document.addEventListener('dragover', e => { if (S.ui.tab !== 'hoy') return; e.preventDefault(); $('#dropzone')?.classList.add('over'); });
document.addEventListener('dragleave', e => { if (e.target.id === 'dropzone') e.target.classList.remove('over'); });
document.addEventListener('drop', e => { if (S.ui.tab !== 'hoy') return; e.preventDefault(); $('#dropzone')?.classList.remove('over'); if (e.dataTransfer.files.length) leerArchivos(e.dataTransfer.files); });

/* bloque 7 */
/* ================= Arranque ================= */
S.ui.tab = null;
try { S.ui.cont = !!localStorage.getItem('contScan'); const vv = localStorage.getItem('vista'); if (vv && vv !== 'auto') document.documentElement.dataset.vista = vv; } catch { }
render();
refrescar().then(iniciarSondeo);
if (!CFG.url || !CFG.pin) pedirAcceso();

/* acceso para diagnóstico desde la consola */
window.S = S; window.API = API; window.guardarConteo = guardarConteo; window.fuentes = fuentes; window.enMarco = enMarco; window.refrescar = refrescar;
Object.defineProperty(window, 'LINES', { get: () => LINES });

</script>
</body>
